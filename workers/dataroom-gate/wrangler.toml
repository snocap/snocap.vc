# This Worker was called `dealroom-gate` until the 2026-08-13 migration. It is
# now `dataroom-gate`, matching this directory, the routes, the workflow and the
# product. The rename was not an edit: a new Worker had to be created, all five
# secrets re-uploaded to it (they cannot be read back off the platform — there is
# no `wrangler secret get`), both routes moved, and the old Worker deleted. The
# auto-deploy workflow was disarmed for the duration so a merge could not publish
# a secretless Worker ahead of those steps.
#
# The D1 database below KEEPS the old spelling, `dealroom-viewers`. That is not an
# oversight: `database_id` is what binds, the name is cosmetic, and renaming it
# would be a second migration that strands the viewer history for nothing. So
# `wrangler d1 …` against this gate still wants `dealroom-viewers`.
#
# The five secrets live on the Worker, not here: HMAC_SECRET (signs the viewer
# cookie), DEALROOM_PW_SECRET (derives the access code), DEALROOM_SA_KEY (the
# Drive service-account key), DATAROOM_OVERRIDE_SECRET (authenticates the
# override call-out), ADMIN_TOKEN (guards /dataroom/admin). Every wrangler
# command run in this directory now acts on `dataroom-gate`.
name = "dataroom-gate"
main = "src/index.ts"
compatibility_date = "2025-04-01"

routes = [
  { pattern = "snocap.vc/dataroom*", zone_name = "snocap.vc" },
  # Kept so the old path 301s to the new one instead of 404ing.
  { pattern = "snocap.vc/dealroom*", zone_name = "snocap.vc" }
]

[vars]
# The GP Docs deal-room folder in Drive (https://drive.google.com/drive/folders/1pkCOx6pM__kgD6Ho6RwSsptYQYGwaKc-).
# Not secret on its own — it's useless without the DEALROOM_SA_KEY grant below.
DRIVE_ROOT_FOLDER_ID = "1pkCOx6pM__kgD6Ho6RwSsptYQYGwaKc-"

# TEMPORARY per-email password overrides (see src/override.ts) — a GP can shadow
# the derived default for one LP (Philip Chow's diligence). The override store now
# lives in the kernelbot-host Redis; the gate POSTs to the kernelbot-api endpoint
# below rather than reading Cloudflare KV (a Worker can't open a raw TCP Redis
# connection). SUNSET CANDIDATE: remove this var, src/override.ts, and its
# call-site in src/index.ts to fully retire the feature.
#
# The endpoint is the existing api.sno.llc (kernelbot-api :3010 via the
# cloudflared-web tunnel) — no new tunnel/hostname/proxy worker.
OVERRIDE_API_BASE = "https://api.sno.llc"

[[d1_databases]]
binding = "DB"
database_name = "dealroom-viewers"
database_id = "48a6eda4-4cd3-4bf7-b965-6639476e42ca"

# ONE-TIME SETUP before deploying: the gate authenticates to the endpoint with a
# shared secret, provisioned as a Worker secret (NOT in this file):
#   cd workers/dataroom-gate && npx wrangler secret put DATAROOM_OVERRIDE_SECRET
# Paste the same long random string the kernelbot side holds as
# DATAROOM_OVERRIDE_SECRET (its .env / .env.enc), mirroring how the apply worker
# shares APPLY_SHARED_SECRET. Until it is set, checkEmailOverride() fails open and
# the gate falls through to the derived code for everyone.
