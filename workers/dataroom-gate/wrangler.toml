# The deployed Worker is called `dealroom-gate`, NOT `dataroom-gate` like this
# directory. Everything a person sees says dataroom — the product, the /dataroom
# route, this directory, the "Deploy Data Room Gate Worker" workflow — and only
# the Worker's own name and its D1 database keep the pre-rename spelling. So
# every wrangler command run here (`secret list`, `secret put`, `d1 execute`,
# `tail`) acts on `dealroom-gate`, and that is the name to look for in the
# Cloudflare dashboard.
#
# Do not "fix" this by editing `name` below. That is not a rename, it is an
# unannounced production migration: deploy-dataroom-worker.yml deploys this
# directory on every push to main, so merging the edit would immediately publish
# a BRAND-NEW Worker with none of the five secrets this one holds (ADMIN_TOKEN,
# DATAROOM_OVERRIDE_SECRET, DEALROOM_PW_SECRET, DEALROOM_SA_KEY, HMAC_SECRET)
# and move both live routes onto it. Without HMAC_SECRET no access code
# verifies; without DEALROOM_SA_KEY the Drive listing fails — the data room is
# down for every LP. A real rename means uploading all five secrets under the
# new name FIRST, then deploying, then verifying both routes and one real login,
# then deleting the old Worker. `database_name` is cosmetic (`database_id` is
# what binds), but renaming the D1 database is a separate risk with no payoff.
name = "dealroom-gate"
main = "src/index.ts"
compatibility_date = "2025-04-01"

routes = [
  { pattern = "snocap.vc/dataroom*", zone_name = "snocap.vc" },
  # Kept so the old path 301s to the new one instead of 404ing.
  { pattern = "snocap.vc/dealroom*", zone_name = "snocap.vc" }
]

[vars]
# The GP Docs deal-room folder in Drive (https://drive.google.com/drive/folders/1pkCOx6pM__kgD6Ho6RwSsptYQYGwaKc-).
# Not secret on its own — it's useless without the DEALROOM_SA_KEY grant below.
DRIVE_ROOT_FOLDER_ID = "1pkCOx6pM__kgD6Ho6RwSsptYQYGwaKc-"

[[d1_databases]]
binding = "DB"
database_name = "dealroom-viewers"
database_id = "48a6eda4-4cd3-4bf7-b965-6639476e42ca"
