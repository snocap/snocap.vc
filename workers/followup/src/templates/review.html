<div class="topbar">
  <div class="mono">
    LP follow-ups · <span data-position>1</span> of {{ total }}
  </div>
  <div class="topbar-actions">
    <button class="ghost" type="button" data-search-open title="Search ( / )">
      Search
    </button>
    <form method="post" action="{{ signOutPath }}">
      <input type="hidden" name="csrf" value="{{ csrf }}" />
      <button class="ghost" type="submit" title="{{ email }}">Sign out</button>
    </form>
  </div>
</div>
<div class="search" data-search hidden>
  <input
    type="search"
    placeholder="Campaign, LP, contact or rep"
    aria-label="Search the Follow Ups"
    autocomplete="off"
    enterkeyhint="go"
  />
  <ul class="pick-list" role="listbox"></ul>
</div>
<div class="progress"><span data-bar style="width: 0"></span></div>
<p class="result error" data-not-found hidden></p>
<div
  data-deck
  data-detail-path="{{ detailPath }}"
  data-csrf="{{ csrf }}"
  data-user="{{ userId }}"
  data-people="{{ people }}"
  data-index="{{ index }}"
  data-limits="{{ limits }}"
>
  {{{ cards }}}
</div>
<div class="nav">
  <button
    class="ghost"
    type="button"
    data-first
    title="First (Up arrow / Home)"
  >
    ⇤ First
  </button>
  <button class="ghost" type="button" data-prev title="Prev (Left arrow)">
    ← Prev
  </button>
  <button class="ghost" type="button" data-next title="Next (Right arrow)">
    Next →
  </button>
  <button class="ghost" type="button" data-last title="Last (Down arrow / End)">
    Last ⇥
  </button>
</div>
{{{ helpers }}}
<script>
  (() => {
    document.documentElement.classList.add("js");
    const deck = document.querySelector("[data-deck]");
    const cards = [...deck.querySelectorAll(".card")];
    const position = document.querySelector("[data-position]");
    const bar = document.querySelector("[data-bar]");
    const notFound = document.querySelector("[data-not-found]");
    if (cards.length === 0) return;
    const ids = cards.map((c) => c.dataset.id);

    // The URL hash is the only record of which Campaign is open, so it is
    // visible and shareable rather than hidden in localStorage.
    function openGone() {
      notFound.textContent =
        "That Campaign is no longer in Follow Ups. Showing the first one instead.";
      notFound.hidden = false;
      return 0;
    }
    function resolveHash(hash) {
      if (!hash) return 0;
      const id = cardIdFromHash(hash);
      if (id === null) return 0;
      const index = ids.indexOf(id);
      return index >= 0 ? index : openGone();
    }

    let at = resolveHash(location.hash);

    // On a wide screen the deck is a row: the selected card centered, its
    // neighbours dimmed and read-only on either side. The same cards and the
    // same show() serve the phone, where the row is one card wide.
    const SLOT_PX = 416;
    let visible = 1;
    function measure() {
      const width = document.documentElement.clientWidth - 28;
      visible = visibleCount(width, SLOT_PX);
      document.documentElement.style.setProperty("--visible", String(visible));
      document.documentElement.classList.toggle("wide", visible > 1);
    }
    measure();
    window.addEventListener("resize", () => {
      const before = visible;
      measure();
      // A phone's keyboard resizes the viewport too; only a new column count
      // re-lays the row, so typing never scrolls the page.
      if (visible !== before) show(at);
    });
    cards.forEach((card, i) =>
      card.addEventListener("click", () => {
        if (card.classList.contains("neighbor")) show(i);
      }),
    );

    function show(index) {
      at = Math.min(Math.max(index, 0), cards.length - 1);
      const slots = carouselSlots(at, cards.length, visible);
      cards.forEach((card, i) => {
        const slot = slots.indexOf(i);
        const neighbor = slot >= 0 && i !== at;
        card.hidden = slot < 0;
        card.style.gridColumn = slot < 0 ? "" : String(slot + 1);
        card.classList.toggle("current", i === at);
        card.classList.toggle("neighbor", neighbor);
        card.querySelector(".card-body").inert = neighbor;
      });
      position.textContent = String(at + 1);
      bar.style.width = ((at + 1) / cards.length) * 100 + "%";
      // replaceState (never pushState) so this never fires "hashchange" —
      // Back leaves the page instead of stepping through every prior card.
      history.replaceState(null, "", hashForCard(ids[at]));
      window.scrollTo(0, 0);
    }
    document.querySelector("[data-first]").onclick = () => show(0);
    document.querySelector("[data-prev]").onclick = () => show(at - 1);
    document.querySelector("[data-next]").onclick = () => show(at + 1);
    document.querySelector("[data-last]").onclick = () =>
      show(cards.length - 1);

    // Pasting or editing a #/<id> URL in this same tab jumps the deck there.
    // show()'s own update is a replaceState, which never fires this event.
    window.addEventListener("hashchange", () => {
      notFound.hidden = true;
      show(resolveHash(location.hash));
    });

    // One highlight rule for both pick lists (mentions and search).
    function highlight(list, index) {
      [...list.querySelectorAll("[role=option]")].forEach((option, i) => {
        option.classList.toggle("active", i === index);
        option.setAttribute("aria-selected", String(i === index));
        if (i === index) option.scrollIntoView({ block: "nearest" });
      });
    }
    function optionButton(label, onPick) {
      const li = document.createElement("li");
      const option = document.createElement("button");
      option.type = "button";
      option.setAttribute("role", "option");
      option.textContent = label;
      // Keep the keyboard up: the tap must not take focus off the input.
      option.addEventListener("mousedown", (e) => e.preventDefault());
      option.addEventListener("click", onPick);
      li.append(option);
      return li;
    }

    // Search: finds a Campaign in the loaded view and jumps the deck to its
    // real position. It never filters the deck.
    const entries = JSON.parse(deck.dataset.index || "[]");
    const search = document.querySelector("[data-search]");
    const searchBox = search.querySelector("input");
    const results = search.querySelector("ul");
    let hits = [];
    let hit = -1;
    function openSearch() {
      search.hidden = false;
      searchBox.value = "";
      renderHits();
      searchBox.focus();
    }
    function closeSearch() {
      search.hidden = true;
      results.replaceChildren();
    }
    function jump(index) {
      closeSearch();
      show(index);
    }
    function renderHits() {
      hits = searchDeck(entries, searchBox.value);
      hit = hits.length ? 0 : -1;
      results.replaceChildren(
        ...hits.map((index) =>
          optionButton(
            [entries[index].name, entries[index].lp]
              .filter(Boolean)
              .join(" · "),
            () => jump(index),
          ),
        ),
      );
      highlight(results, hit);
    }
    document.querySelector("[data-search-open]").onclick = () =>
      search.hidden ? openSearch() : closeSearch();
    searchBox.addEventListener("input", renderHits);
    searchBox.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        hit = moveHighlight(hit, hits.length, e.key === "ArrowDown" ? 1 : -1);
        highlight(results, hit);
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (hit >= 0) jump(hits[hit]);
      } else if (e.key === "Escape") {
        closeSearch();
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.target.closest("textarea, input, select")) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === "ArrowRight" || e.key === "j") show(at + 1);
      if (e.key === "ArrowLeft" || e.key === "k") show(at - 1);
      if (e.key === "Home" || e.key === "ArrowUp") {
        e.preventDefault();
        show(0);
      }
      if (e.key === "End" || e.key === "ArrowDown") {
        e.preventDefault();
        show(cards.length - 1);
      }
      if (e.key === "/") {
        e.preventDefault();
        openSearch();
      }
    });

    let startX = null;
    let startY = null;
    deck.addEventListener("touchstart", (e) => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    });
    deck.addEventListener("touchend", (e) => {
      if (startX === null) return;
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;
      startX = null;
      if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
      if (e.target.closest("textarea, input, .thumbs")) return;
      show(dx < 0 ? at + 1 : at - 1);
    });

    // The expanded card's timeline and contacts load when it is first opened:
    // each one is a few Airtable calls, so the deck does not make them all up front.
    deck.querySelectorAll("details.more").forEach((more) => {
      more.addEventListener("toggle", async () => {
        if (!more.open || more.dataset.loaded) return;
        more.dataset.loaded = "1";
        const slot = more.querySelector("[data-detail]");
        try {
          const id = more.closest(".card").dataset.id;
          const res = await fetch(deck.dataset.detailPath + "/" + id);
          slot.innerHTML = await res.text();
          slot.dispatchEvent(new Event("detail-loaded", { bubbles: true }));
        } catch {
          slot.textContent = "Could not load the history. Try again.";
          delete more.dataset.loaded;
        }
      });
    });

    // Mentionable people, cached for the browser session. The page brings the
    // Campaigns' collaborators; each opened thread adds its authors and mentions.
    const PEOPLE_KEY = "followup-people";
    let people = [];
    function addPeople(list) {
      const byId = new Map(people.map((p) => [p.id, p]));
      for (const p of list || []) {
        if (p && p.id && p.name && !byId.has(p.id)) byId.set(p.id, p);
      }
      people = [...byId.values()];
      try {
        sessionStorage.setItem(PEOPLE_KEY, JSON.stringify(people));
      } catch {}
    }
    // The server's list goes first so a renamed collaborator shows by their
    // current Airtable name, not a name cached earlier in the session.
    addPeople(JSON.parse(deck.dataset.people || "[]"));
    try {
      addPeople(JSON.parse(sessionStorage.getItem(PEOPLE_KEY) || "[]"));
    } catch {}

    deck.addEventListener("detail-loaded", (e) => {
      const tag = e.target.querySelector("[data-people]");
      if (tag) addPeople(JSON.parse(tag.dataset.people || "[]"));
    });

    // The @ being typed right before the caret, if any.
    function activeMention(box) {
      const before = box.value.slice(0, box.selectionStart);
      const m = before.match(/(^|\s)@([^\s@]{0,40})$/);
      if (!m) return null;
      return { start: before.length - m[2].length - 1, query: m[2] };
    }

    function matching(query) {
      const q = query.toLowerCase();
      return people
        .filter(
          (p) =>
            !q ||
            p.name
              .toLowerCase()
              .split(/\s+/)
              .some((word) => word.startsWith(q)),
        )
        .slice(0, 6);
    }

    const limits = JSON.parse(deck.dataset.limits || "{}");

    // Airtable takes at most limits.maxBytes per file, so a bigger image is
    // re-encoded as a smaller JPEG here, before it is sent. A browser that
    // cannot draw it (HEIC outside Safari) leaves it too big, and the submit
    // says so.
    async function shrink(file) {
      if (file.size <= limits.maxBytes || !shrinkable(file.type)) return file;
      let bitmap;
      try {
        bitmap = await createImageBitmap(file);
      } catch {
        return file;
      }
      const canvas = document.createElement("canvas");
      let scale = Math.min(1, 4096 / Math.max(bitmap.width, bitmap.height));
      let blob = null;
      for (let tries = 0; tries < 6; tries++) {
        canvas.width = Math.max(1, Math.round(bitmap.width * scale));
        canvas.height = Math.max(1, Math.round(bitmap.height * scale));
        canvas
          .getContext("2d")
          .drawImage(bitmap, 0, 0, canvas.width, canvas.height);
        blob = await new Promise((done) =>
          canvas.toBlob(done, "image/jpeg", 0.85),
        );
        if (blob.size <= limits.maxBytes) break;
        scale *= shrinkScale(blob.size, limits.maxBytes);
      }
      const name = (file.name || "image").replace(/\.[^.]*$/, "") + ".jpg";
      return new File([blob], name, { type: "image/jpeg" });
    }

    deck.querySelectorAll("form.actions").forEach((form) => {
      const box = form.querySelector("textarea");
      const list = form.querySelector(".mention-list");
      const submit = form.querySelector("button[type=submit]");
      const result = form.querySelector(".result");
      const reasons = form.querySelector("[data-reasons]");
      const reasonPick = reasons.querySelector("select");
      const picker = form.querySelector("input[type=file]");
      const thumbs = form.querySelector(".thumbs");
      const inserted = new Map();
      let pendingReason = null;
      let lastMacro = null;
      let found = [];
      let highlighted = -1;
      let attached = [];
      let busy = false;

      function syncButton() {
        submit.disabled = busy || !canPost(box.value, attached.length);
      }

      function remember(mentions) {
        for (const p of mentions) inserted.set(p.id, p);
      }

      function closeList() {
        list.hidden = true;
        list.replaceChildren();
        found = [];
        highlighted = -1;
      }

      function pick(person) {
        const token = activeMention(box);
        if (!token) return closeList();
        const after = box.value.slice(box.selectionStart);
        const text = "@" + person.name + " ";
        box.value = box.value.slice(0, token.start) + text + after;
        const caret = token.start + text.length;
        box.focus();
        box.setSelectionRange(caret, caret);
        remember([person]);
        closeList();
        syncButton();
      }

      function openList() {
        if (busy) return closeList();
        const token = activeMention(box);
        found = token && people.length ? matching(token.query) : [];
        if (found.length === 0) return closeList();
        list.replaceChildren(
          ...found.map((person) =>
            optionButton(person.name, () => pick(person)),
          ),
        );
        highlighted = 0;
        highlight(list, highlighted);
        list.hidden = false;
      }

      function fill(text, mentions) {
        box.value = applyMacro(box.value, lastMacro, text);
        // Only a box the macro now owns outright can be replaced by the next.
        lastMacro = box.value === text ? text : null;
        remember(mentions);
        box.focus();
        box.setSelectionRange(box.value.length, box.value.length);
        syncButton();
      }

      // Images show as thumbnails, anything else as a chip with its name;
      // each has a × to drop it before posting.
      function renderThumbs() {
        thumbs.replaceChildren(
          ...attached.map((item) => {
            const figure = document.createElement("figure");
            if (item.url) {
              const img = document.createElement("img");
              img.src = item.url;
              img.alt = item.file.name || "Image";
              figure.append(img);
            } else {
              figure.className = "file";
              figure.textContent = item.file.name || "File";
            }
            const remove = document.createElement("button");
            remove.type = "button";
            remove.className = "remove";
            remove.setAttribute(
              "aria-label",
              "Remove " + (item.file.name || "attachment"),
            );
            remove.textContent = "×";
            remove.addEventListener("click", () => {
              if (item.url) URL.revokeObjectURL(item.url);
              attached = attached.filter((a) => a !== item);
              renderThumbs();
            });
            figure.append(remove);
            return figure;
          }),
        );
        thumbs.hidden = attached.length === 0;
        syncButton();
      }

      function addFiles(fileList) {
        if (busy) return;
        const incoming = [...fileList];
        const { keep, rejected } = acceptFiles(
          attached.map((a) => a.file),
          incoming,
          limits,
        );
        for (const i of keep) {
          const file = incoming[i];
          attached.push({
            file,
            url: /^image\//.test(file.type) ? URL.createObjectURL(file) : null,
          });
        }
        renderThumbs();
        result.className = rejected.length ? "result error" : "result";
        result.textContent = rejected.length
          ? "Skipped: " + rejected.join("; ") + "."
          : "";
      }

      function clearAttached() {
        for (const a of attached) if (a.url) URL.revokeObjectURL(a.url);
        attached = [];
        renderThumbs();
      }

      picker.addEventListener("change", () => {
        addFiles(picker.files);
        picker.value = "";
      });
      box.addEventListener("paste", (e) => {
        const data = e.clipboardData;
        if (!data) return;
        const files = [...data.items]
          .filter((item) => item.kind === "file")
          .map((item) => item.getAsFile())
          .filter(Boolean);
        if (files.length === 0) return;
        // A copied screenshot sometimes carries text too; keep that paste.
        if (!data.getData("text/plain")) e.preventDefault();
        addFiles(files);
      });
      form.addEventListener("dragover", (e) => {
        if (![...e.dataTransfer.types].includes("Files")) return;
        e.preventDefault();
        form.classList.add("dropping");
      });
      form.addEventListener("dragleave", (e) => {
        if (!form.contains(e.relatedTarget)) form.classList.remove("dropping");
      });
      form.addEventListener("drop", (e) => {
        if (!e.dataTransfer.files.length) return;
        e.preventDefault();
        form.classList.remove("dropping");
        addFiles(e.dataTransfer.files);
      });

      box.addEventListener("input", () => {
        openList();
        syncButton();
      });
      box.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          closeList();
          if (!submit.disabled) form.requestSubmit();
          return;
        }
        if (list.hidden) return;
        if (e.key === "ArrowDown" || e.key === "ArrowUp") {
          e.preventDefault();
          highlighted = moveHighlight(
            highlighted,
            found.length,
            e.key === "ArrowDown" ? 1 : -1,
          );
          highlight(list, highlighted);
        } else if ((e.key === "Enter" || e.key === "Tab") && highlighted >= 0) {
          e.preventDefault();
          pick(found[highlighted]);
        } else if (e.key === "Escape") {
          e.preventDefault();
          closeList();
        }
      });
      box.addEventListener("blur", () => setTimeout(closeList, 150));

      form.querySelectorAll(".chip[data-macro]").forEach((chip) => {
        chip.addEventListener("click", () => {
          if (busy) return;
          const mentions = JSON.parse(chip.dataset.mentions || "[]");
          if (chip.dataset.reason) {
            pendingReason = { template: chip.dataset.template, mentions };
            reasons.hidden = false;
            reasonPick.focus();
            return;
          }
          fill(chip.dataset.template, mentions);
        });
      });
      reasonPick.addEventListener("change", () => {
        if (!pendingReason || !reasonPick.value) return;
        fill(
          pendingReason.template.replace("{reason}", reasonPick.value),
          pendingReason.mentions,
        );
        pendingReason = null;
        reasonPick.value = "";
        reasons.hidden = true;
      });

      // While a submit is in flight nothing on the card can change what it
      // sends: the box is read-only (a disabled one would drop out of the
      // form), and the macros, reasons and attachment controls are disabled.
      function lock(on) {
        busy = on;
        syncButton();
        box.readOnly = on;
        reasonPick.disabled = on;
        picker.disabled = on;
        form
          .querySelectorAll(".chip[data-macro], .thumbs .remove")
          .forEach((control) => (control.disabled = on));
        form.classList.toggle("busy", on);
        if (on) closeList();
      }

      async function send(files, onEvent) {
        const body = new FormData(form);
        body.delete("files");
        for (const file of files) {
          body.append("files", file, file.name || "attachment");
        }
        const res = await fetch(form.action, {
          method: "POST",
          headers: { Accept: "application/x-ndjson, application/json" },
          body,
        });
        // A refusal before any write (stale page, signed out, a bad file)
        // comes back as plain JSON; a submit that ran streams its steps.
        const type = res.headers.get("Content-Type") || "";
        if (!type.includes("ndjson")) return res.json();
        return readSubmit(res.body, onEvent);
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (busy) return;
        form.elements.mentions.value = JSON.stringify(
          [...inserted.values()].filter((p) =>
            box.value.includes("@" + p.name),
          ),
        );
        const card = form.closest(".card");
        await submitFlow({
          files: attached.map((a) => a.file),
          maxBytes: limits.maxBytes,
          lock,
          label: (text) => (submit.textContent = text),
          detail: (text) => {
            result.className = text ? "result error" : "result";
            result.textContent = text;
          },
          prepare: shrink,
          send,
          posted: () =>
            setTimeout(() => {
              box.value = "";
              inserted.clear();
              lastMacro = null;
              clearAttached();
              submit.textContent = "Post comment";
              lock(false);
              show(cards.indexOf(card) + 1);
            }, 900),
        });
      });
    });

    show(at);
  })();
</script>
