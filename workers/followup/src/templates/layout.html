<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{ title }}</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Fira+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        min-height: 100%;
        font-family: "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body {
        background: #0a0a0a;
        color: #fff;
        padding: 16px 14px 40px;
      }
      main {
        width: 100%;
        max-width: 560px;
        margin: 0 auto;
      }
      /* A wide screen shows the deck as a row of --visible cards (an odd count,
         set by the page script), the selected one centered. */
      .wide main {
        max-width: calc(var(--visible) * 416px);
      }
      .js [data-deck] {
        display: grid;
        grid-template-columns: repeat(var(--visible, 1), minmax(0, 1fr));
        gap: 16px;
        align-items: start;
      }
      .js [data-deck] > .card {
        grid-row: 1;
      }
      .wide .card.current {
        border-color: #f15800;
        box-shadow: 0 0 0 1px #f15800;
      }
      .card.neighbor {
        opacity: 0.4;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      .card.neighbor:hover {
        opacity: 0.65;
      }
      .card.neighbor .card-body {
        pointer-events: none;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      a {
        color: #f15800;
      }
      .mono {
        font-family: "Fira Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #9f9f9f;
      }
      .notice {
        padding-top: 18vh;
      }
      .notice h1 {
        font-size: 22px;
        font-weight: 400;
        margin: 8px 0 12px;
      }
      .notice p {
        color: #bdbdbd;
        line-height: 1.55;
        margin-bottom: 24px;
      }
      .button,
      button {
        display: inline-block;
        background: #f15800;
        color: #fff;
        border: 0;
        padding: 12px 18px;
        font:
          500 15px "Inter",
          system-ui,
          sans-serif;
        text-decoration: none;
        cursor: pointer;
      }
      button.ghost {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #ddd;
      }
      button:disabled {
        opacity: 0.5;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }
      .topbar-actions {
        display: flex;
        gap: 8px;
      }
      .topbar-actions button,
      .topbar form button {
        padding: 6px 10px;
        font-size: 12px;
      }
      .progress {
        height: 3px;
        background: rgba(255, 255, 255, 0.1);
        margin-bottom: 14px;
      }
      .progress span {
        display: block;
        height: 100%;
        background: #f15800;
        transition: width 0.2s;
      }
      .card {
        background: #151515;
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 18px 16px;
      }
      .js .card[hidden] {
        display: none;
      }
      .card h2 {
        font-size: 21px;
        font-weight: 500;
        line-height: 1.25;
      }
      .card .lp {
        color: #bdbdbd;
        margin: 4px 0 14px;
      }
      .facts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px 14px;
        margin-bottom: 14px;
      }
      .facts dt {
        font-family: "Fira Mono", monospace;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #888;
      }
      .facts dd {
        font-size: 15px;
        margin-top: 2px;
      }
      .overdue dd {
        color: #ff7a45;
        font-weight: 600;
      }
      .overdue dt::after {
        content: " · overdue";
        color: #ff7a45;
      }
      .latest {
        border-left: 2px solid #f15800;
        padding: 4px 0 4px 10px;
        color: #ddd;
        font-size: 14px;
        line-height: 1.45;
        margin-bottom: 14px;
      }
      details.more summary {
        cursor: pointer;
        color: #f15800;
        font-size: 14px;
        margin-bottom: 10px;
      }
      .timeline {
        list-style: none;
        margin: 6px 0 16px;
      }
      .timeline li {
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        padding: 10px 0;
        font-size: 14px;
        line-height: 1.45;
      }
      .timeline .meta {
        font-size: 12px;
        color: #888;
      }
      .timeline .comment .meta {
        color: #f1a070;
      }
      .timeline .body {
        white-space: pre-wrap;
        color: #ccc;
        margin-top: 4px;
      }
      .contacts {
        display: grid;
        gap: 8px;
        margin-bottom: 8px;
      }
      .contact {
        background: #1d1d1d;
        padding: 10px 12px;
      }
      .contact .links {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }
      .contact .links a {
        border: 1px solid rgba(241, 88, 0, 0.6);
        padding: 6px 12px;
        text-decoration: none;
        font-size: 14px;
      }
      .actions {
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        padding-top: 14px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 10px;
      }
      .chips .chip {
        font-size: 13px;
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #ddd;
        padding: 8px 11px;
      }
      .chips .chip:active {
        border-color: #f15800;
        background: rgba(241, 88, 0, 0.15);
      }
      textarea,
      select {
        width: 100%;
        padding: 11px 12px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #fff;
        font:
          16px "Inter",
          system-ui,
          sans-serif;
        margin-bottom: 10px;
        color-scheme: dark;
      }
      /* An open select's options are drawn by the browser, and without their
         own colors they inherit the white text over the OS's own (often white)
         popup. Set both, per OS theme: options.test.ts checks the contrast. */
      select option,
      select optgroup {
        background-color: #1d1d1d;
        color: #ffffff;
      }
      @media (prefers-color-scheme: light) {
        select option,
        select optgroup {
          background-color: #ffffff;
          color: #111111;
        }
      }
      textarea {
        min-height: 96px;
        resize: vertical;
      }
      .reasons[hidden],
      .search[hidden],
      .thumbs[hidden],
      .pick-list[hidden] {
        display: none;
      }
      .search {
        position: relative;
        margin-bottom: 12px;
      }
      .search input {
        width: 100%;
        padding: 11px 12px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(241, 88, 0, 0.6);
        color: #fff;
        font:
          16px "Inter",
          system-ui,
          sans-serif;
        color-scheme: dark;
      }
      .search .pick-list {
        margin: 0;
      }
      .search .pick-list:empty {
        display: none;
      }
      .thumbs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 10px;
      }
      .thumbs figure {
        position: relative;
        width: 72px;
        height: 72px;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      .thumbs figure.file {
        width: auto;
        height: 36px;
        max-width: 200px;
        padding: 0 30px 0 10px;
        display: flex;
        align-items: center;
        font-size: 13px;
        color: #ddd;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .thumbs figure.file .remove {
        top: 50%;
        right: 4px;
        margin-top: -13px;
      }
      .thumbs img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .thumbs .remove {
        position: absolute;
        top: -8px;
        right: -8px;
        width: 26px;
        height: 26px;
        padding: 0;
        border-radius: 50%;
        background: #0a0a0a;
        border: 1px solid rgba(255, 255, 255, 0.4);
        color: #fff;
        font-size: 16px;
        line-height: 1;
      }
      .actions.dropping {
        outline: 2px dashed #f15800;
        outline-offset: 4px;
      }
      .chips .attach {
        cursor: pointer;
        border-style: dashed;
        font-size: 13px;
        border: 1px dashed rgba(255, 255, 255, 0.3);
        color: #ddd;
        padding: 8px 11px;
      }
      .compose {
        position: relative;
      }
      .pick-list {
        list-style: none;
        margin: -6px 0 10px;
        border: 1px solid rgba(241, 88, 0, 0.6);
        background: #1d1d1d;
      }
      .pick-list button {
        display: block;
        width: 100%;
        text-align: left;
        background: transparent;
        color: #fff;
        padding: 12px 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      .pick-list li:first-child button {
        border-top: 0;
      }
      .pick-list button.active,
      .pick-list button:active {
        background: rgba(241, 88, 0, 0.2);
      }
      .actions.busy textarea,
      .actions.busy .chips,
      .actions.busy .thumbs {
        opacity: 0.5;
        pointer-events: none;
      }
      .actions.busy button[type="submit"]:disabled {
        opacity: 0.85;
        cursor: progress;
      }
      .result {
        margin-top: 10px;
        font-size: 14px;
        color: #8fd18f;
      }
      .result.error {
        color: #ff7a45;
      }
      .nav {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 14px;
      }
      .nav {
        max-width: 560px;
        margin-left: auto;
        margin-right: auto;
      }
      .nav button {
        flex: 1;
        padding: 12px 6px;
        white-space: nowrap;
      }
      .empty {
        color: #bdbdbd;
        padding: 30px 0;
      }
    </style>
  </head>
  <body>
    <main>{{{ body }}}</main>
  </body>
</html>
