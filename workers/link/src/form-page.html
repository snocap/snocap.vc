<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SNØCAP Links</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Fira+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        min-height: 100%;
        font-family: "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body {
        background: #0a0a0a;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }
      .card {
        width: 100%;
        max-width: 460px;
      }
      h1 {
        font-size: 20px;
        font-weight: 400;
        margin-bottom: 4px;
      }
      .who {
        font-family: "Fira Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #9f9f9f;
        margin-bottom: 32px;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      label {
        display: block;
        font-size: 13px;
        color: #bdbdbd;
        margin-bottom: 6px;
      }
      .hint {
        font-size: 12px;
        color: #666;
        margin-top: 6px;
        line-height: 1.5;
      }
      input {
        width: 100%;
        padding: 13px 15px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 0;
        color: #fff;
        font-family: "Inter", system-ui, sans-serif;
        font-size: 15px;
        font-weight: 300;
        outline: none;
        transition: border-color 150ms ease;
      }
      input::placeholder {
        color: #666;
      }
      input:focus {
        border-color: #f15800;
      }
      button {
        width: 100%;
        padding: 14px 20px;
        background: #f15800;
        color: #fff;
        border: none;
        border-radius: 0;
        font-family: "Fira Mono", monospace;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background 120ms ease;
      }
      button:hover {
        background: #c24600;
      }
      .banner {
        padding: 12px 15px;
        font-size: 13px;
        line-height: 1.5;
        margin-bottom: 24px;
        border-left: 2px solid #f15800;
        background: rgba(241, 88, 0, 0.08);
      }
      .banner code {
        font-family: "Fira Mono", monospace;
        word-break: break-all;
      }
      .banner a {
        color: #f15800;
      }
      /* The white plate matters: the QR is black on white so it scans, and a
         white block on the dark card is also what gets pasted elsewhere. */
      .qr-frame {
        display: inline-block;
        margin-top: 12px;
        padding: 8px;
        background: #fff;
        line-height: 0;
      }
      .qr-frame img {
        display: block;
        width: 160px;
        height: 160px;
      }
      .qr-caption {
        font-size: 12px;
        color: #8a8a8a;
        margin-top: 8px;
        line-height: 1.5;
      }
      .error {
        color: #f15800;
        font-size: 13px;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Short links</h1>
      <div class="who">Signed in as {{ email }}</div>
      {{{ banner }}} {{{ error }}}
      <form method="POST" action="/link/create">
        <div>
          <label for="url">Destination URL</label>
          <input
            id="url"
            type="url"
            name="url"
            placeholder="https://example.com/a/very/long/path"
            value="{{ url }}"
            required
            autofocus
          />
        </div>
        <div>
          <label for="pathname">Short path</label>
          <input
            id="pathname"
            type="text"
            name="pathname"
            placeholder="fund-two"
            value="{{ pathname }}"
            required
          />
          <div class="hint">
            Becomes snocap.vc/link/&lt;path&gt;. Almost anything works — it is
            case-insensitive and cannot contain a slash.
          </div>
        </div>
        <div>
          <label for="expires">Expires (optional)</label>
          <input
            id="expires"
            type="date"
            name="expires"
            value="{{ expires }}"
          />
          <div class="hint">
            Works through the end of this day, UTC, then stops. Leave blank for
            a permanent link.
          </div>
        </div>
        <button type="submit">Create Link</button>
      </form>
    </div>
  </body>
</html>
